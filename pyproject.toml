[project]
name = "budget-tracker"
version = "1.0.0"
description = "A small command-line budget tracker: spending by category, limits and a monthly summary."
requires-python = ">=3.12"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
